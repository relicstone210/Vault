<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5FCBEF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pocket Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone column. Colored hero banner per section with Vic the guide, person chips, alphabetical list, tab bar.
   Each section owns an accent: Passwords mint, Codes sunflower, Links coral, More grape. */
:root{
  --bg:#EAF7F4; --surface:#FFFFFF; --surface2:#E2F0ED; --ink:#0F2B2E; --ink2:#4F6D6C; --line:#CBE2DD;
  --pw-fill:#10B899; --pw-on:#04251F; --pw-ink:#067560;
  --cd-fill:#FFB020; --cd-on:#2B1B00; --cd-ink:#9A5B00;
  --lk-fill:#FF6B5A; --lk-on:#3A0F09; --lk-ink:#BF301D;
  --mr-fill:#8E6BFF; --mr-on:#1B0A52; --mr-ink:#5B3CD1;
  --h-pw1:#8DF2D6; --h-pw2:#5FCBEF; --h-cd1:#FFE595; --h-cd2:#FFA971; --h-lk1:#FFBCA6; --h-lk2:#FF8FBD; --h-mr1:#D2C3FF; --h-mr2:#93DBFF;
  --hero-ink:#08292B; --glass:rgba(255,255,255,.55);
  --accent:var(--pw-fill); --on-accent:var(--pw-on); --accent-ink:var(--pw-ink);
  --hero1:var(--h-pw1); --hero2:var(--h-pw2);
  --warn:#8F5600; --warn-soft:#FFF0CC; --bad:#B0301E; --bad-soft:#FADFDA; --ok:#128A55;
  --shadow:0 1px 2px rgba(15,43,46,.08),0 10px 26px rgba(15,43,46,.10);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08191F; --surface:#10262E; --surface2:#173540; --ink:#E6F4F1; --ink2:#9EBBB7; --line:#24434B;
  --pw-fill:#3DE0C0; --pw-on:#03211C; --pw-ink:#5DEBCD;
  --cd-fill:#FFC94D; --cd-on:#2B1B00; --cd-ink:#FFD36E;
  --lk-fill:#FF8A76; --lk-on:#3A0F09; --lk-ink:#FFA08F;
  --mr-fill:#B79CFF; --mr-on:#1B0A52; --mr-ink:#C8B4FF;
  --h-pw1:#0F6B5C; --h-pw2:#0E4A6B; --h-cd1:#7A5A0A; --h-cd2:#7A3A1F; --h-lk1:#8A2F25; --h-lk2:#7A2A55; --h-mr1:#4B2D9E; --h-mr2:#1E5C8A;
  --hero-ink:#F2FBF8; --glass:rgba(255,255,255,.14);
  --warn:#FFC94D; --warn-soft:#33270A; --bad:#FF8F7D; --bad-soft:#3A1E1A; --ok:#6FD79B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08191F; --surface:#10262E; --surface2:#173540; --ink:#E6F4F1; --ink2:#9EBBB7; --line:#24434B;
  --pw-fill:#3DE0C0; --pw-on:#03211C; --pw-ink:#5DEBCD;
  --cd-fill:#FFC94D; --cd-on:#2B1B00; --cd-ink:#FFD36E;
  --lk-fill:#FF8A76; --lk-on:#3A0F09; --lk-ink:#FFA08F;
  --mr-fill:#B79CFF; --mr-on:#1B0A52; --mr-ink:#C8B4FF;
  --h-pw1:#0F6B5C; --h-pw2:#0E4A6B; --h-cd1:#7A5A0A; --h-cd2:#7A3A1F; --h-lk1:#8A2F25; --h-lk2:#7A2A55; --h-mr1:#4B2D9E; --h-mr2:#1E5C8A;
  --hero-ink:#F2FBF8; --glass:rgba(255,255,255,.14);
  --warn:#FFC94D; --warn-soft:#33270A; --bad:#FF8F7D; --bad-soft:#3A1E1A; --ok:#6FD79B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35); color-scheme:dark}
[data-tab="pw"]{--accent:var(--pw-fill);--on-accent:var(--pw-on);--accent-ink:var(--pw-ink);--hero1:var(--h-pw1);--hero2:var(--h-pw2)}
[data-tab="codes"]{--accent:var(--cd-fill);--on-accent:var(--cd-on);--accent-ink:var(--cd-ink);--hero1:var(--h-cd1);--hero2:var(--h-cd2)}
[data-tab="links"]{--accent:var(--lk-fill);--on-accent:var(--lk-on);--accent-ink:var(--lk-ink);--hero1:var(--h-lk1);--hero2:var(--h-lk2)}
[data-tab="more"]{--accent:var(--mr-fill);--on-accent:var(--mr-on);--accent-ink:var(--mr-ink);--hero1:var(--h-mr1);--hero2:var(--h-mr2)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;max-width:520px;margin:0 auto;position:relative}
.shell{height:100%;display:flex;flex-direction:column;min-height:0}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}

/* hero banner */
.hero{position:relative;margin-top:12px;border-radius:26px;padding:16px 16px 18px;min-height:116px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);overflow:hidden;box-shadow:var(--shadow);flex:none}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.26);pointer-events:none}
.hero::before{width:150px;height:150px;right:-40px;top:-70px}
.hero::after{width:74px;height:74px;left:44%;bottom:-38px;background:rgba(255,255,255,.18)}
.hero .tt{position:relative;z-index:1;max-width:56%}
.hero h1{font-size:26px;font-weight:800;line-height:1.08}
.meta{margin:4px 0 0;font-size:13px;font-weight:600;opacity:.78}
.hero .icon-btn{position:absolute;right:12px;top:12px;z-index:2;background:var(--glass);border-color:transparent;color:var(--hero-ink)}
.vic-h{position:absolute;right:56px;bottom:-8px;width:88px;z-index:1;display:block}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.search{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;color:var(--ink2);flex:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px 0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--pc,var(--accent))}
.chip[aria-pressed="true"]{background:var(--pc,var(--accent));border-color:transparent;color:var(--pcon,var(--on-accent))}
.chip[aria-pressed="true"] .dot{background:var(--pcon,var(--on-accent))}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7}
.chip.ghost{border-style:dashed;color:var(--ink2);padding-left:14px}
.chip.plain{padding-left:14px}

/* list */
.mainwrap{flex:1;min-height:0;position:relative;margin-top:6px}
#scroll{position:absolute;inset:0;overflow-y:auto;padding:4px 26px 100px 0;overscroll-behavior:contain}
.sec{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 2px 6px;font-family:var(--display);font-size:15px;font-weight:800;color:var(--accent-ink);letter-spacing:.06em}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.anim .row{animation:rise .32s ease both}
.row-h{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:62px}
.row-h:active{background:var(--surface2)}
.av{width:40px;height:40px;border-radius:13px;background:var(--c,var(--surface2));color:var(--cf,var(--accent-ink));display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .sub{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;color:var(--ink);background:var(--surface2);padding:3px 10px;border-radius:999px;flex:none}
@supports (background:color-mix(in srgb,red 10%,blue)){.tag{background:color-mix(in srgb,var(--pc,var(--ink2)) 30%,var(--surface))}}
.flag{font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;flex:none}
.detail{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;animation:rise .2s ease both}
.f{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:14px;padding:8px 8px 8px 12px;min-height:50px}
.f .fb{flex:1;min-width:0}
.fl{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.fv{display:block;overflow-wrap:anywhere;font-size:15px}
.fv.mono,.mono{font-family:var(--mono);font-size:14px}
a.fv{color:var(--accent-ink);font-weight:700;text-decoration:none}
.mini{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);flex:none;transition:transform .12s}
.mini:active,.icon-btn:active{background:var(--line);transform:scale(.92)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rail{position:absolute;right:-6px;top:8px;bottom:92px;width:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:3}
.rail button{font-family:var(--display);font-size:11px;font-weight:800;color:var(--accent-ink);width:26px;flex:1 1 0;max-height:20px;min-height:11px;display:grid;place-items:center;text-align:center}
.codes{display:flex;flex-direction:column;gap:6px}
.code{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:14px;padding:4px 4px 4px 12px;min-height:46px}
.code .mono{flex:1;min-width:0;overflow-wrap:anywhere;letter-spacing:.04em}
.code.used .mono{text-decoration:line-through;opacity:.5}
.used-btn{height:34px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:800;color:var(--ink2);border:1.5px solid var(--line);background:var(--surface)}
.code.used .used-btn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--line)}
.note{white-space:pre-wrap;overflow-wrap:anywhere}

/* health tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0 2px}
.tile{border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:2px solid transparent;transition:transform .12s;text-align:left}
.tile:active{transform:scale(.96)}
.tile b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.tile span{font-size:12px;font-weight:700;opacity:.85}
.tile.t1{background:color-mix(in srgb,var(--pw-fill) 30%,var(--surface))}
.tile.t2{background:color-mix(in srgb,var(--cd-fill) 38%,var(--surface))}
.tile.t3{background:color-mix(in srgb,var(--lk-fill) 32%,var(--surface))}
.tile[aria-pressed="true"]{border-color:var(--ink)}

/* buttons / forms */
.btn{height:46px;padding:0 18px;border-radius:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);text-align:center;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000 45%);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000 45%)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.solid-bad{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px;box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:absolute;right:0;bottom:14px;width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000 45%),var(--shadow);z-index:4;transition:transform .12s}
.fab:active{transform:translateY(3px) scale(.96)}
.fab svg.ic{width:28px;height:28px;stroke-width:2.4}
label.l{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
.in,select.in,textarea.in{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:12px 14px;min-height:48px;outline:0}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:110px;resize:vertical;font-family:var(--mono);font-size:13px}
.pwrow{display:flex;gap:6px;align-items:center}
.pwrow .in{flex:1;min-width:0;font-family:var(--mono)}
.help{font-size:13px;color:var(--ink2);margin:6px 0 0}
.meter{display:flex;gap:5px;align-items:center;margin-top:8px}
.meter i{flex:1;height:7px;border-radius:5px;background:var(--line);transition:background .15s}
.meter span{font-size:12px;font-weight:800;min-width:54px;text-align:right;color:var(--ink2)}
.meter[data-s="0"] i:nth-child(-n+1){background:var(--bad)}
.meter[data-s="1"] i:nth-child(-n+2){background:#F59E0B}
.meter[data-s="2"] i:nth-child(-n+3){background:#84CC16}
.meter[data-s="3"] i:nth-child(-n+4){background:var(--ok)}
.empty{text-align:center;padding:14px 8px 30px;color:var(--ink2)}
.empty .vic-e{display:flex;justify-content:center;margin-bottom:6px}
.empty .bubble{margin:0 auto 14px;max-width:28ch;text-align:left}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:30ch}
.empty .stack{display:flex;flex-direction:column;gap:10px;align-items:center}

/* Vic + bubble */
.vic{display:block;overflow:visible}
.vic .eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.vic.wave .arm{animation:wave 1.3s ease-in-out infinite;transform-origin:142px 150px}
.vic:not(.wave) .arm{display:none}
.vic.bob{animation:bob 3s ease-in-out infinite}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);color:var(--ink);border-radius:18px;padding:11px 14px;font-weight:600;font-size:14.5px;line-height:1.35}
.bubble.tl::before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.tb::before{content:"";position:absolute;left:50%;top:-10px;width:16px;height:16px;margin-left:-8px;background:var(--surface);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.lockrow{display:flex;align-items:center;gap:14px;width:100%;max-width:360px;text-align:left}
.lockrow .vic{flex:none}
.lockrow .bubble{flex:1}

/* bottom nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0;border-top:1px solid var(--line);background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--ink2);font-size:11.5px;font-weight:700;text-align:center;transition:transform .12s}
.nav button:active{transform:scale(.92)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .nb{background:var(--nc);color:var(--nk)}
.nb{width:50px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.nav button[aria-current="page"] svg.ic{stroke-width:2.4}

/* more */
.menu{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.mi{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;width:100%;transition:transform .12s}
.mi:active{transform:scale(.98)}
.mi .ico{width:42px;height:42px;border-radius:13px;background:var(--c);color:var(--cf);display:grid;place-items:center;flex:none}
.mi b{display:block;font-weight:700}
.mi span.s{display:block;color:var(--ink2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:14px}
.panel h2{font-size:16px;margin-bottom:6px}
.panel p{margin:0 0 8px;color:var(--ink2)}
.panel p:last-child{margin-bottom:0}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;margin:10px 0 0}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(5,18,18,.55);z-index:20;animation:fade .15s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:21;border-top:5px solid var(--accent);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:2px}
.sheet .row2{display:flex;gap:8px;margin-top:18px}
.sheet .row2 .btn{flex:1}
.dlg{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(5,18,18,.6);z-index:40}
.dlg .box{background:var(--surface);border-radius:22px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.dlg p{margin:0 0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.toast.vic{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:8px 14px 8px 8px;border-radius:20px;width:max-content}
.toast.vic .vic{width:46px;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 150px)) rotate(var(--r));opacity:0}}
@keyframes dotpop{0%{transform:scale(.5)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* lock screen */
.lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px 0;overflow-y:auto}
.lock::before{content:"";position:fixed;inset:0 0 auto 0;height:42%;background:linear-gradient(160deg,var(--h-pw1),var(--h-mr2));opacity:.55;z-index:-1;border-radius:0 0 50% 50%/0 0 28% 28%}

.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:10px}

.phrase{width:100%;max-width:340px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.linkbtn{color:var(--accent-ink);font-weight:700;font-size:14px;margin-top:12px;text-align:center}
.lockfoot{margin-top:6px;color:var(--ink2);font-size:12.5px;max-width:34ch}
.rkbox{background:var(--surface);border:3px dashed var(--accent);border-radius:18px;padding:16px 12px;font-size:20px;font-weight:600;letter-spacing:.08em;margin:18px 0 10px;width:100%;max-width:360px;word-break:break-all;user-select:all}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:12px 0;text-align:left}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.import-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.import-item:first-child{border-top:0}
.import-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.import-item .rt b{font-size:14px}
.qrbox{background:#fff;padding:14px;border-radius:18px;margin:14px auto 0;max-width:300px}
.qrbox svg{width:100%;height:auto;display:block}
@media (max-height:700px){.pad{gap:8px}.pad button{width:60px;height:60px;font-size:22px}.pad{grid-template-columns:repeat(3,60px)}.lockrow .vic{width:84px}}

.patwrap{display:flex;justify-content:center}

function patternInit(el, done) {
  const dots = [...el.querySelectorAll('.pd')], line = el.querySelector('#patline');
  let path = [], drawing = false, cur = null;
  const ctr = i => ({ x: 40 + 80 * (i % 3), y: 40 + 80 * Math.floor(i / 3) });
  const pos = ev => { const r = el.getBoundingClientRect(); return { x:(ev.clientX - r.left) * 240 / r.width, y:(ev.clientY - r.top) * 240 / r.height }; };
  const hit = p => { for (let i = 0; i < 9; i++) { const c = ctr(i); if (Math.hypot(c.x - p.x, c.y - p.y) < 34) return i; } return -1; };

    line.setAttribute('points', path.map(i => { const c = ctr(i); return c.x + ',' + c.y; }).concat(cur ? [cur.x + ',' + cur.y] : []).join(' '));
    dots.forEach((d, i) => { const k = path.indexOf(i); d.classList.toggle('on', k >= 0); if (k >= 0) d.style.setProperty('--c', PAL[k % 8][0]); });

  const end = () => { if (!drawing) return; drawing = false; cur = null; draw(); const p = path.slice(); setTimeout(() => { path = []; draw(); if (p.length) done(p); }, 140); };
  el.onpointerup = end; el.onpointercancel = end;
}

async function createVault(code) {
  const L = S.lock; L.busy = true; renderLock();
  try {
    const raw = rand(32), rk = genRK();
    S.rec = await buildWrappers(code, rk, raw, L.mode);
    S.dek = raw; S.key = await importDek(raw); S.data = newData();
    await persist(); store.del(LS_FAILS);
    S.lock = freshLock('unlock'); S.rkShow = rk; bump(); render();
  } catch (e) { console.error(e); L.busy = false; L.msg = 'Could not create the vault.'; renderLock(); }
}
async function recoverGo() {
  const L = S.lock; if (L.busy) return;
  const rk = normRK(L.buf);
  if (rk.length !== 25) { L.msg = 'A recovery key has 25 letters and numbers.'; renderLock(); return; }
  L.busy = true; renderLock();
  try {
    const kek = await derive(rk, fromB64(S.rec.rsalt), S.rec.riter || RITER);
    L.dek = await unwrapDek(kek, S.rec.wrapRec);
    L.busy = false; L.buf = ''; L.msg = ''; L.stage = 'rec-new'; L.mode = 'pin'; renderLock();
  } catch (e) { L.busy = false; L.msg = 'That recovery key does not work.'; renderLock(); }
}
async function finishRecovery(code) {
  const L = S.lock; L.busy = true; renderLock();
  try {
    const raw = L.dek, rk = genRK();
    const key = await importDek(raw);
    const data = fixData(await unseal(key, S.rec));
    S.rec = { ...S.rec, ...await buildWrappers(code, rk, raw, L.mode) };
    S.dek = raw; S.key = key; S.data = data; await persist(); store.del(LS_FAILS);
    S.lock = freshLock('unlock'); S.rkShow = rk; bump(); render();
  } catch (e) { console.error(e); L.busy = false; L.msg = 'Could not finish recovery.'; renderLock(); }
}
async function lockSubmit() {
  const L = S.lock; if (L.busy) return;
  const code = L.buf, st = L.stage;
  if (st === 'unlock' && L.method === 'qpin') return quickSubmit('pin', code);
  if (CHOOSE.includes(st)) {
    const rec = st.startsWith('rec');
    if (st === 'new' || st === 'rec-new') {
      if (!validCode(code)) { L.msg = L.mode === 'pin' ? 'Enter 6 digits.' : 'Use at least 8 characters.'; L.buf = ''; renderLock(); return; }
      L.first = code; L.buf = ''; L.stage = rec ? 'rec-confirm' : 'confirm'; L.msg = ''; renderLock(); return;
    }
    if (code !== L.first) { L.msg = 'Codes did not match. Start again.'; L.buf = ''; L.first = ''; L.stage = rec ? 'rec-new' : 'new'; renderLock(); return; }
    return rec ? finishRecovery(code) : createVault(code);
  }
  const f = failState();
  if (f.until > Date.now()) { L.msg = `Too many tries. Wait ${Math.ceil((f.until - Date.now()) / 1000)} seconds.`; L.buf = ''; renderLock(); return; }
  L.busy = true; renderLock();
  try {
    const rec = S.rec;
    if (rec.v === 2) {
      const kek = await derive(code, fromB64(rec.salt), rec.iter || ITER);
      const raw = await unwrapDek(kek, rec.wrapPin);
      const key = await importDek(raw);
      S.data = fixData(await unseal(key, rec)); S.dek = raw; S.key = key;
      store.del(LS_FAILS);
      if (rec.rkPending) { S.lock = freshLock('unlock'); bump(); await newRecoveryKey(); return; }
    } else {
      /* older vault: upgrade it to the recovery-key format using the same code */
      const key1 = await derive(code, fromB64(rec.salt), rec.iter || ITER);
      const data = fixData(await unseal(key1, rec));
      const raw = rand(32), rk = genRK();
      S.rec = await buildWrappers(code, rk, raw, rec.mode || 'pin');
      S.dek = raw; S.key = await importDek(raw); S.data = data; await persist(); store.del(LS_FAILS);
      S.rkShow = rk;
    }
    S.lock = freshLock('unlock'); S.tab = 'pw'; S.person = 'all'; S.q = ''; bump(); render();
  } catch (e) {
    const n = (f.n || 0) + 1;
    const until = n >= 5 ? Date.now() + Math.min(300, 15 * (n - 4)) * 1000 : 0;
    try { store.set(LS_FAILS, JSON.stringify({ n, until })); } catch (er) {}
    L.busy = false; L.buf = ''; L.msg = until ? 'Too many tries. Wait a bit and try again.' : 'Wrong code.'; renderLock();
  }
}
function lockKey(k) {
  const L = S.lock; if (L.busy) return;
  buzz();
  const max = L.stage === 'unlock' && L.method === 'qpin' ? 4 : 6;
  if (k === 'del') L.buf = L.buf.slice(0, -1); else if (L.buf.length < max) L.buf += k;
  L.msg = ''; renderLock();
  if (L.buf.length === max) setTimeout(lockSubmit, 160);
}
/* ---- quick unlock: extra locks on the same data key. The full code always works. ---- */
const QITER = 200000;
async function openAfterQuick(raw) {
  const key = await importDek(raw);
  S.data = fixData(await unseal(key, S.rec)); S.dek = raw; S.key = key;
  S.lock = freshLock('unlock'); S.tab = 'pw'; S.person = 'all'; S.q = ''; S.hf = null; bump();
  if (S.rec.rkPending) { await newRecoveryKey(); return; }
  render();
}
async function quickSubmit(kind, secret) {
  const L = S.lock; if (L.busy) return;
  const w = quickOf()[kind];
  if (!w) { L.method = 'code'; L.buf = ''; renderLock(); return; }
  L.busy = true; renderLock();
  try {
    const kek = await derive(secret, fromB64(w.salt), QITER);
    const raw = await unwrapDek(kek, w.wrap);
    w.fails = 0;
    await openAfterQuick(raw); commit();
  } catch (e) {
    const n = (w.fails || 0) + 1; w.fails = n;
    let msg = kind === 'pin' ? 'Wrong PIN.' : 'Wrong pattern.';
    if (n >= 5) { delete S.rec.quick[kind]; msg = 'Too many tries. Use your full code.'; L.method = 'code'; }
    try { store.set(LS_VAULT, JSON.stringify(S.rec)); } catch (er) {}
    L.busy = false; L.buf = ''; L.msg = msg; renderLock();
  }
}
async function bioKey(out) {

async function bioEnable() {

    const salt = rand(32);

      && (!S.hf || (S.hf === 'reused' ? rm[e.pass] > 1 : strength(e.pass) < 1))
      && (!q || [e.site, e.user, e.url, e.note].some(v => String(v || '').toLowerCase().includes(q))));
  } else if (S.tab === 'codes') list = S.data.codes.filter(e => (S.person === 'all' || e.person === S.person) && (!q || [e.service, e.note].some(v => String(v || '').toLowerCase().includes(q))));

    fr.readAsDataURL(file);

}

function parseCSV(text) {

    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const ix = re => head.findIndex(h => re.test(h));
  const iN = ix(/^(name|title|site|service|app|account)$/), iU = ix(/^(url|login_uri|website|web site|link|address)$/),

        if (n1 !== n2) { toast('The two codes do not match', 'bad'); return; }
        if (!validCode(n1)) { toast('Use exactly 6 digits, or 8 or more characters', 'bad'); return; }
        try {
          const salt = rand(16), kek = await derive(n1, salt, ITER), pin = /^\d{6}$/.test(n1);
          S.rec = { ...S.rec, iter:ITER, salt:toB64(salt), mode:pin ? 'pin' : 'phrase', len:pin ? 6 : 0, wrapPin:await wrapDek(kek, S.dek) };
        } catch (e) { toast('Could not change the code', 'bad'); return; }
        toast('Code changed');
      } else toast('Saved');
      commit(); bump(); closeSheet(); return;
    }
    case 'method': S.lock.method = el.dataset.v; S.lock.buf = ''; S.lock.msg = ''; S.lock.bioTried = false; renderLock(); return;
    case 'bio-go': bioUnlock(); return;
    case 'q-bio-on': bioEnable(); return;
    case 'q-bio-off': delete S.rec.quick.bio; commit(); settingsSheet(); return;
    case 'q-pin-on': quickPinSheet(); return;
    case 'q-pin-off': delete S.rec.quick.pin; commit(); settingsSheet(); return;
    case 'q-pin-save': { const a = $('#qp1').value, b = $('#qp2').value; if (!/^\d{4}$/.test(a)) { toast('Use exactly 4 digits', 'bad'); return; } if (a !== b) { toast('The two PINs do not match', 'bad'); return; } await saveQuick('pin', a); return; }
    case 'q-pat-on': quickPatSheet(); return;
    case 'q-pat-off': delete S.rec.quick.pattern; commit(); settingsSheet(); return;
    case 'imp-kind': {
      const x = S.imp.items[+el.dataset.i], toks = t => String(t || '').split(/[\s,;]+/).filter(w => /^[A-Za-z0-9\-]{4,}$/.test(w));
      if (x.kind === 'codes') { x.kind = 'pw'; if (!x.pass) x.pass = (x.codes || []).join(' '); }
      else { x.kind = 'codes'; if (!x.codes || !x.codes.length) x.codes = toks([x.user, x.pass].join(' ')); }
      x.on = !!(x.kind === 'codes' ? x.codes.length : x.pass) && !x.dup; refreshImport(); return;
    }
    case 'to-codes': {
      const e = D.pw.find(x => x.id === id); if (!e) return;
      const toks = [e.user, e.pass, e.note].join(' ').split(/[\s,;]+/).filter(w => /^[A-Za-z0-9\-]{4,}$/.test(w));
      S.tab = 'codes'; S.open = null; S.person = 'all'; S.q = ''; renderMain(); openEditor(null);
      $('#f-svc').value = e.site.replace(CODESUFFIX, '').trim() || e.site; $('#f-codes').value = toks.join('\n'); $('#f-person').value = e.person;
      S.edit.moveFrom = id; return;
    }
    case 'about': aboutSheet(); return;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.q = t.value; renderList(false); }
  if (t.id === 'f-pass') { const m = $('#meter'); if (m) { m.dataset.s = strength(t.value); m.innerHTML = meterHtml(t.value); } }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'rk-chk') { $('#rk-go').disabled = !t.checked; return; }
  if (t.matches('.import-item input[type=checkbox]')) { S.imp.items[+t.dataset.i].on = t.checked; const b = document.querySelector('[data-act="imp-save"]'); const n = S.imp.items.filter(x => x.on).length; if (b) { b.textContent = 'Save ' + n; b.disabled = !n; } }
  if (t.id === 'imp-person' && S.imp) S.imp.person = t.value;
  if (t.id === 'f-img' && t.files[0]) {
    try { S.edit.img = await shrinkImage(t.files[0]); $('#imgbox').innerHTML = imgBox(); } catch (e) { toast('Could not read that picture', 'bad'); }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#dlg').innerHTML) ask.res && ask.res(false); else if ($('#sheet').innerHTML) closeSheet(); return; }
  if (!S.key && !S.rkShow) {
    const st = S.lock.stage, pin = CHOOSE.includes(st) ? S.lock.mode === 'pin' : (st === 'unlock' && (S.lock.method === 'qpin' || (S.lock.method === 'code' && S.rec && S.rec.mode === 'pin')));
    if (pin) { if (/^\d$/.test(ev.key)) lockKey(ev.key); else if (ev.key === 'Backspace') lockKey('del'); }
  }
});

/* ------------------------------------------------------------------ boot */
S.rec = loadRec();
S.lock = freshLock(S.rec ? 'unlock' : 'new');
render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
